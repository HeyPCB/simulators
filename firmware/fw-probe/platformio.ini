; fw-probe, built for each chip a simulator image in this repository runs.
; Versions pinned: PlatformIO 6.1.18 (firmware/Dockerfile), espressif32 8.0.0
; (Arduino-ESP32 3.3.12). DIO flash: QEMU boots a DIO image.

[env]
platform = platformio/espressif32@8.0.0
framework = arduino
board_build.flash_mode = dio

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32]
board = esp32dev
