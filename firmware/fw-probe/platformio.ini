; fw-probe, built for each chip a simulator image in this repository runs.
; Versions pinned: PlatformIO 6.1.18 (firmware/Dockerfile), espressif32 8.0.0
; (Arduino-ESP32 3.3.12), espressif8266 4.2.1 (Arduino-ESP8266 3.1.2). DIO flash:
; QEMU boots a DIO image.

[env]
platform = platformio/espressif32@8.0.0
framework = arduino
board_build.flash_mode = dio

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32]
board = esp32dev

[env:esp8266]
; A WeMos D1 mini (ESP-12, 4 MB). Its firmware.bin is the whole flash from 0x0
; (eboot, then the app), which esp8266-emu boots as it is.
platform = platformio/espressif8266@4.2.1
board = d1_mini
